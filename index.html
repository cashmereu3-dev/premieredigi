/* VOICE: prestige premiere, restrained luxury
   IDEA: a screening-room programme for a one-night premiere
   PICTURE: 9:16 triptych of real microdrama episodes over the Premiere logo loop
   COLOUR and TYPE: obsidian #0B0B0B, tungsten gold #C59B5F; Anton + Inter
   LAYOUT: sharp hairline bands, logo fixed in the lower half of the screen */
:root{color-scheme:dark}
html{background:#0B0B0B}
body{margin:0;overflow-x:clip}
*{border-radius:0}
.logo-bg{object-fit:cover;object-position:center 42%;
  -webkit-mask-image:radial-gradient(ellipse 75% 85% at 50% 55%,#000 45%,transparent 100%);
          mask-image:radial-gradient(ellipse 75% 85% at 50% 55%,#000 45%,transparent 100%)}
@media (min-aspect-ratio:8/9){.logo-bg{object-fit:contain}}
.hero-glow{background:radial-gradient(ellipse 45% 55% at 74% 50%,rgba(197,155,95,.22),rgba(197,155,95,.06) 45%,transparent 75%)}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal-fade{animation:fade .25s ease-out}.modal-rise{animation:rise .3s ease-out}
@media (prefers-reduced-motion:reduce){.modal-fade,.modal-rise,.animate-pulse{animation:none}*{transition:none!important}}
